name: Dependency Review

on:
  pull_request:
  merge_group:

permissions:
  contents: read

jobs:
  dependency-review:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          persist-credentials: false

      - name: Dependency Review
        uses: actions/dependency-review-action@bbc44d14a204704ccc493733616cd1e93a0321ec # v5.0.1
        with:
          # Allow only Apache-2.0 compatible licenses (Apache Category A)
          # Based on https://www.apache.org/legal/resolved.html
          allow-licenses: >-
            Apache-2.0, MIT, ISC, BSD-2-Clause, BSD-3-Clause, 0BSD,
            BlueOak-1.0.0, Unlicense, CC0-1.0,
            CC-BY-4.0,
            Artistic-2.0, PSF-2.0
          # Demo-only CocoaPods tooling (demo/Gemfile.lock). The Ruby license
          # lets users take the code under BSD-2-Clause instead.
          allow-dependencies-licenses: >-
            pkg:gem/json,
            pkg:gem/concurrent-ruby
